# Tiny Tapeout project information
project:
  title:        "uwasic Onboarding"      # Project title
  author:       "Nick Shaw"      # Your name
  discord:      "floatingelephan42"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "SPI peripheral that configures output enables, PWM enables, and duty cycle for 16 output pins"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_uwasic_onboarding_nick_shaw"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "spi_peripheral.v"
    - "pwm_peripheral.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "SCLK"
  ui[1]: "COPI"
  ui[2]: "nCS"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "PWM/EN out[0]"
  uo[1]: "PWM/EN out[1]"
  uo[2]: "PWM/EN out[2]"
  uo[3]: "PWM/EN out[3]"
  uo[4]: "PWM/EN out[4]"
  uo[5]: "PWM/EN out[5]"
  uo[6]: "PWM/EN out[6]"
  uo[7]: "PWM/EN out[7]"

  # Bidirectional pins
  uio[0]: "PWM/EN out[8]"
  uio[1]: "PWM/EN out[9]"
  uio[2]: "PWM/EN out[10]"
  uio[3]: "PWM/EN out[11]"
  uio[4]: "PWM/EN out[12]"
  uio[5]: "PWM/EN out[13]"
  uio[6]: "PWM/EN out[14]"
  uio[7]: "PWM/EN out[15]"

# Do not change!
yaml_version: 6
